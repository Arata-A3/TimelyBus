<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d1117">

        // 表示テーマ（自動／ライト／ダーク）を描画前に反映して、ちらつきを防ぐ
        try {
            const t = JSON.parse(localStorage.getItem('tb.theme'));
            if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) { }
    </script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" href="./icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>TimelyBus - 徳島バス時刻データ</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: rgba(22, 27, 34, 0.7);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-primary: #58a6ff;
            --accent-hover: #3182ce;
            --accent-glow: rgba(88, 166, 255, 0.4);
            --success-color: #2ea043;
            --success-glow: rgba(46, 160, 67, 0.4);
            --warn-color: #f0883e;
            --warn-glow: rgba(240, 136, 62, 0.35);
            --danger-color: #ff7b72;
            --border-color: rgba(240, 246, 252, 0.1);
            --on-accent: #000;
            --accent-tint: rgba(88, 166, 255, 0.12);
            --time-color: #ffffff;
            --header-bg: rgba(13, 17, 23, 0.85);
            --input-bg: rgba(0, 0, 0, 0.3);
            --seg-bg: rgba(0, 0, 0, 0.25);
            --soft-bg: rgba(255, 255, 255, 0.03);
            --soft-bg-strong: rgba(255, 255, 255, 0.07);
            --hover-bg: rgba(255, 255, 255, 0.1);
            --shadow: rgba(0, 0, 0, 0.2);
            --viewer-bg: #1b1f24;
            --border-radius-lg: 16px;
            --border-radius-md: 12px;
            --border-radius-sm: 8px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
        }

        /* ライトテーマ（設定で「ライト」、または「自動」でスマホがライトモードのとき） */
        :root[data-theme="light"] {
            --bg-color: #f4f6f9;
            --surface-color: rgba(255, 255, 255, 0.9);
            --text-primary: #1f2328;
            --text-secondary: #59636e;
            --accent-primary: #0969da;
            --accent-hover: #0550ae;
            --accent-glow: rgba(9, 105, 218, 0.22);
            --success-color: #1a7f37;
            --success-glow: rgba(26, 127, 55, 0.18);
            --warn-color: #bc4c00;
            --warn-glow: rgba(188, 76, 0, 0.18);
            --danger-color: #cf222e;
            --border-color: rgba(31, 35, 40, 0.15);
            --on-accent: #ffffff;
            --accent-tint: rgba(9, 105, 218, 0.08);
            --time-color: #1f2328;
            --header-bg: rgba(244, 246, 249, 0.9);
            --input-bg: #ffffff;
            --seg-bg: rgba(31, 35, 40, 0.07);
            --soft-bg: rgba(31, 35, 40, 0.025);
            --soft-bg-strong: rgba(31, 35, 40, 0.06);
            --hover-bg: rgba(31, 35, 40, 0.06);
            --shadow: rgba(31, 35, 40, 0.08);
            --viewer-bg: #e6e9ee;
        }
        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                --bg-color: #f4f6f9;
                --surface-color: rgba(255, 255, 255, 0.9);
                --text-primary: #1f2328;
                --text-secondary: #59636e;
                --accent-primary: #0969da;
                --accent-hover: #0550ae;
                --accent-glow: rgba(9, 105, 218, 0.22);
                --success-color: #1a7f37;
                --success-glow: rgba(26, 127, 55, 0.18);
                --warn-color: #bc4c00;
                --warn-glow: rgba(188, 76, 0, 0.18);
                --danger-color: #cf222e;
                --border-color: rgba(31, 35, 40, 0.15);
                --on-accent: #ffffff;
                --accent-tint: rgba(9, 105, 218, 0.08);
                --time-color: #1f2328;
                --header-bg: rgba(244, 246, 249, 0.9);
                --input-bg: #ffffff;
                --seg-bg: rgba(31, 35, 40, 0.07);
                --soft-bg: rgba(31, 35, 40, 0.025);
                --soft-bg-strong: rgba(31, 35, 40, 0.06);
                --hover-bg: rgba(31, 35, 40, 0.06);
                --shadow: rgba(31, 35, 40, 0.08);
                --viewer-bg: #e6e9ee;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Meiryo', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            font-variant-numeric: tabular-nums; /* 時刻の数字の幅をそろえる */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #app {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            position: relative;
            overflow-x: hidden;
        }

        .glass-card {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-lg);
            box-shadow: 0 8px 32px var(--shadow);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            font-family: inherit;
            text-decoration: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            width: 100%;
        }

        .btn:hover { background: var(--hover-bg); border-color: var(--text-secondary); }

        .btn-primary {
            background: var(--accent-primary);
            color: var(--on-accent);
            border: none;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px var(--accent-glow);
        }

        .input-field {
            width: 100%;
            padding: var(--spacing-md);
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .input-field:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 2px var(--accent-glow); }

        .app-header {
            padding: var(--spacing-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: var(--header-bg);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            cursor: pointer;
        }

        .page-container {
            padding: var(--spacing-lg) var(--spacing-md);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            flex: 1;
        }

        .hidden { display: none !important; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 var(--accent-glow); }
            70% { box-shadow: 0 0 0 20px rgba(88, 166, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(88, 166, 255, 0); }
        }

        .animate-pulse { animation: pulse 2s infinite; }

        .muted { color: var(--text-secondary); }
        .small { font-size: 0.8rem; }

        /* --- Countdown --- */
        .seg { display: flex; gap: 4px; background: var(--seg-bg); padding: 4px; border-radius: var(--border-radius-md); }
        .seg button { flex: 1; padding: 8px 4px; border: none; border-radius: var(--border-radius-sm); cursor: pointer; background: transparent; color: var(--text-secondary); font: inherit; font-size: 0.85rem; }
        .seg button.active { background: var(--accent-primary); color: var(--on-accent); font-weight: 700; }

        .stop-picker { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: end; }
        .stop-picker label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }
        .swap-btn {
            grid-row: 1 / span 2; grid-column: 2; align-self: center;
            width: 48px; height: 48px; border-radius: 50%;
            border: 1px solid var(--border-color); background: var(--soft-bg-strong);
            color: var(--accent-primary); font-size: 1.4rem; cursor: pointer;
        }

        .next-card { text-align: center; padding: 28px 20px; }
        .next-card .label { font-size: 0.85rem; color: var(--text-secondary); }
        .time-display { font-size: 4rem; line-height: 1.1; font-weight: 700; color: var(--time-color); margin: 8px 0 12px; font-variant-numeric: tabular-nums; }
        .time-display.long { font-size: 2.6rem; }
        .time-display.soon { color: var(--warn-color); }
        .time-display.now { color: var(--danger-color); }
        .time-display.arrived { color: var(--success-color); }
        .trip-route { display: flex; justify-content: center; align-items: baseline; gap: 10px; font-size: 1.3rem; font-weight: 700; }
        .trip-route .arrow { color: var(--text-secondary); font-size: 1rem; }
        .trip-meta { margin-top: 6px; font-size: 0.8rem; color: var(--text-secondary); }

        .status-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 12px;
            background: var(--accent-glow); color: var(--accent-primary);
        }
        .status-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

        .trip-list { display: grid; gap: 8px; }
        .trip-item {
            display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
            padding: 12px 14px; border-radius: var(--border-radius-md);
            border: 1px solid var(--border-color); background: var(--soft-bg);
        }
        .trip-item .t { font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
        .trip-item .t .arr { font-weight: 400; color: var(--text-secondary); font-size: 0.9rem; }
        .trip-item .remain { font-weight: 700; color: var(--accent-primary); text-align: right; font-variant-numeric: tabular-nums; }
        .trip-item .sub { font-size: 0.75rem; color: var(--text-secondary); }
        .trip-item .ride { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border-color); background: transparent; color: var(--text-primary); cursor: pointer; font-family: inherit; justify-self: end; }
        .trip-item.best { border-color: var(--accent-primary); background: var(--accent-tint); }
        .trip-item.past { opacity: 0.55; }
        .tag { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 1px 8px; border-radius: 10px; background: var(--accent-primary); color: var(--on-accent); margin-left: 6px; vertical-align: 2px; }
        .search-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; align-items: end; }
        .search-row label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }
        .search-row .input-field { padding: 8px 12px; height: 44px; }
        .result-head .q { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px; }
        .tt-row { display: grid; grid-template-columns: 36px 1fr; border-top: 1px solid var(--border-color); }
        .tt-row:first-child { border-top: none; }
        .tt-row.current .tt-h { color: var(--accent-primary); }
        .tt-h { font-weight: 700; font-size: 1.1rem; text-align: center; padding: 8px 0; font-variant-numeric: tabular-nums; }
        .tt-mins { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 6px 0; }
        .tt-m { min-width: 64px; padding: 3px 6px; border-radius: 6px; border: 1px solid transparent; line-height: 1.25; font-variant-numeric: tabular-nums; }
        .tt-m b { font-size: 1.15rem; }
        .tt-m small { display: block; font-size: 0.7rem; color: var(--text-secondary); }
        .tt-m.next { border-color: var(--accent-primary); background: var(--accent-tint); }
        .tt-m.past { opacity: 0.6; }
        .tt-m.past b { font-weight: 400; }
        .tt-mark { font-size: 0.7rem; color: var(--text-secondary); margin-left: 2px; vertical-align: 5px; }

        /* --- よく使う区間 --- */
        .fav-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .fav-chips:empty { display: none; }
        .chip {
            padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-color);
            background: var(--soft-bg-strong); color: var(--text-primary); font: inherit; font-size: 0.85rem; cursor: pointer;
        }
        .chip.active { border-color: var(--accent-primary); background: var(--accent-tint); color: var(--accent-primary); font-weight: 700; }
        .chip.add { border-style: dashed; color: var(--text-secondary); background: transparent; }

        /* --- 設定 --- */
        .settings-item { display: grid; gap: 8px; }
        .settings-item + .settings-item { margin-top: 20px; }
        .settings-label { font-weight: 700; }
        .fav-row { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border-color); }
        .fav-row:first-child { border-top: none; }
        .fav-row .sub { font-size: 0.75rem; color: var(--text-secondary); }
        .mini-btn { padding: 6px 10px; border-radius: var(--border-radius-sm); border: 1px solid var(--border-color); background: transparent; color: var(--text-primary); font: inherit; font-size: 0.8rem; cursor: pointer; }
        .mini-btn.danger { color: var(--danger-color); }
        .day-sep { font-size: 0.75rem; color: var(--text-secondary); padding: 6px 2px 0; }

        .progress { height: 8px; border-radius: 4px; background: var(--soft-bg-strong); overflow: hidden; margin: 16px 0 4px; }
        .progress > div { height: 100%; background: var(--accent-primary); transition: width 1s linear; }

        /* --- PDF list --- */
        .pdf-card { display: flex; flex-direction: column; gap: 12px; padding: 18px; }
        .pdf-actions { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
        .pdf-actions .btn { padding: 12px 8px; }

        /* --- PDF viewer (full screen) --- */
        .viewer { position: fixed; inset: 0; z-index: 50; background: var(--viewer-bg); display: flex; flex-direction: column; }
        .viewer-bar {
            display: flex; align-items: center; gap: 6px;
            padding: 8px; padding-top: max(8px, env(safe-area-inset-top));
            background: var(--header-bg); border-bottom: 1px solid var(--border-color);
        }
        .viewer-title { flex: 1; min-width: 0; font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .icon-btn {
            min-width: 44px; height: 40px; padding: 0 10px; border-radius: var(--border-radius-sm);
            border: 1px solid var(--border-color); background: var(--soft-bg-strong);
            color: var(--text-primary); font: inherit; font-size: 1.05rem; cursor: pointer;
        }
        .icon-btn.zoom-label { font-size: 0.85rem; min-width: 60px; font-variant-numeric: tabular-nums; }
        .viewer-scroll {
            flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y; overscroll-behavior: contain;
        }
        .viewer-pages { width: 100%; }
        .viewer-pages img { display: block; width: 100%; height: auto; background: #fff; margin-bottom: 8px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        .viewer-msg { padding: 40px 20px; text-align: center; color: var(--text-secondary); }
        .viewer-hint {
            position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
            background: rgba(0,0,0,0.75); color: #fff; font-size: 0.8rem; padding: 8px 14px; border-radius: 20px;
            pointer-events: none; transition: opacity 0.6s; white-space: nowrap;
        }
    </style>
</head>

        // --- 祝日判定（内閣府の祝日法ルールに基づく計算。1980〜2099年対応） ---
        const holidayCache = {};
        const holidaysOf = (y) => {
            if (holidayCache[y]) return holidayCache[y];
            const nthMonday = (m, n) => { const first = new Date(y, m - 1, 1).getDay(); return 1 + ((8 - first) % 7) + (n - 1) * 7; };
            const shift = Math.floor((y - 1980) / 4);
            const spring = Math.floor(20.8431 + 0.242194 * (y - 1980) - shift);
            const autumn = Math.floor(23.2488 + 0.242194 * (y - 1980) - shift);
            const base = [
                [1, 1], [1, nthMonday(1, 2)], [2, 11], [2, 23], [3, spring], [4, 29],
                [5, 3], [5, 4], [5, 5], [7, nthMonday(7, 3)], [8, 11], [9, nthMonday(9, 3)],
                [9, autumn], [10, nthMonday(10, 2)], [11, 3], [11, 23]
            ];
            const key = (d) => `${d.getMonth() + 1}-${d.getDate()}`;
            const set = new Set(base.map(([m, d]) => `${m}-${d}`));
            // 国民の休日（祝日に挟まれた平日）
            for (const [m, d] of base) {
                const next = new Date(y, m - 1, d + 1), after = new Date(y, m - 1, d + 2);
                if (set.has(key(after)) && !set.has(key(next)) && next.getDay() !== 0) set.add(key(next));
            }
            // 振替休日（日曜の祝日 → 次の祝日でない日）
            for (const [m, d] of base) {
                const date = new Date(y, m - 1, d);
                if (date.getDay() !== 0) continue;
                const sub = new Date(y, m - 1, d + 1);
                while (set.has(key(sub))) sub.setDate(sub.getDate() + 1);
                set.add(key(sub));
            }
            return (holidayCache[y] = set);
        };

        // PDF記載: 土日・祝日・年末年始(12/29〜1/3)・阿波おどり期間(8/12〜8/15)は土日祝ダイヤ
        const autoDayType = (date) => {
            const m = date.getMonth() + 1, d = date.getDate(), w = date.getDay();
            if (w === 0 || w === 6) return 'weekend';
            if (holidaysOf(date.getFullYear()).has(`${m}-${d}`)) return 'weekend';
            if ((m === 12 && d >= 29) || (m === 1 && d <= 3)) return 'weekend';
            if (m === 8 && d >= 12 && d <= 15) return 'weekend';

                    const arrMs = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, arr).getTime();

                dayTrips.sort((a, b) => a.depMs - b.depMs);
                result.push(...dayTrips);
            }
            return result.slice(0, count);

            const date = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayOffset);
            const dayType = state.dayOverride || autoDayType(date);
            const dir = from < to ? 'down' : 'up';
            const list = [];
            for (const trip of TIMETABLE[dayType][dir]) {
                const dep = trip.times[from], arr = trip.times[to];
                if (dep == null || arr == null) continue;
                const depMs = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, dep).getTime();
                const arrMs = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, arr).getTime();
                list.push({ ...trip, dep, arr, depMs, arrMs, offset: dayOffset, dayType, id: `s-${dayType}-${dayOffset}-${dir}-${trip.no}-${dep}` });
            }
            if (!list.length) return { dayType, trips: [], best: null, note: '' };
            list.sort((a, b) => a.dep - b.dep || a.arr - b.arr);
            let idx = -1, note = '';
            if (mode === 'depart') {
                idx = list.findIndex(t => t.dep >= timeMin);
                if (idx < 0) { idx = list.length - 1; note = 'この時刻以降の便はありません。最終便を表示しています。'; }
            } else {
                // 間に合う便のうち、いちばん遅く出発できる便（バイパス経由などで追い越しがあるため到着順ではなく発車順で判断）
                list.forEach((t, i) => { if (t.arr <= timeMin) idx = i; });
                if (idx < 0) {
                    const earliest = Math.min(...list.map(t => t.arr));
                    idx = list.findIndex(t => t.arr === earliest);
                    note = 'この時刻までに着く便はありません。いちばん早く着く便を表示しています。';
                }
            }
            return { dayType, trips: list.slice(Math.max(0, idx - 2), idx + 3), best: list[idx], note };
        };

        const nowPlus = (min) => {
            const d = new Date(Date.now() + min * 60000);
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        };

        const formatCountdown = (ms) => {
            if (ms <= 0) return '0:00';
            const total = Math.floor(ms / 1000);
            const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
            if (h > 0) return `${h}時間${String(m).padStart(2, '0')}分`;
            return `${m}:${String(s).padStart(2, '0')}`;
        };

        const formatRemainShort = (ms) => {
            if (ms <= -DEPARTED_GRACE_MS) return '発車済み';
            if (ms <= 0) return '発車時刻';
            const min = Math.floor(ms / 60000);
            if (min < 1) return 'まもなく';
            if (min < 60) return `あと${min}分`;
            return `あと${Math.floor(min / 60)}時間${min % 60}分`;
        };

        const dayPrefix = (offset) => offset === 0 ? '' : offset === 1 ? '明日 ' : '明後日以降 ';

        // --- UI RENDERERS ---
        const render = () => {
            stopTick();
            const root = document.getElementById('root');
            const header = document.getElementById('main-header');
            const page = router.current();
            header.classList.toggle('hidden', page.name === 'home' || page.name === 'view');

            root.innerHTML = '';
            root.className = page.name === 'view' ? '' : 'page-container animate-fade-in';

            if (page.name === 'home') renderHome(root);
            else if (page.name === 'countdown') renderCountdown(root);
            else if (page.name === 'pdf') renderPdfList(root);
            else if (page.name === 'settings') renderSettings(root);
            else if (page.name === 'view') viewer.open(root, page.arg);
            window.scrollTo(0, 0);
        };

        const renderHome = (root) => {
            const last = PDF_FILES.find(p => p.name === store.get('lastPdf', ''));
            root.innerHTML = `
                <div class="glass-card" style="text-align: center; margin-top: 32px;">
                    <img src="./icon.png" alt="" width="88" height="88" style="display: block; border-radius: 20px; margin: 0 auto 24px; box-shadow: 0 6px 18px var(--shadow);">
                    <h1 style="font-size: 2.2rem; margin-bottom: 8px;">TimelyBus</h1>
                    <p class="muted" style="margin-bottom: 32px;">徳島バス 時刻表・カウントダウン</p>
                    <div style="display: grid; gap: 12px;">
                        <button class="btn btn-primary" onclick="router.navigate('countdown')">バスを調べる・カウントダウン</button>
                        ${last ? `<button class="btn" onclick="router.navigate('view', '${last.name}')">前回の時刻表を開く（${esc(last.label)}）</button>` : ''}
                        <button class="btn" onclick="router.navigate('pdf')">時刻表PDFを見る</button>
                        <button class="btn" onclick="router.navigate('settings')">設定</button>
                    </div>
                </div>
                <p class="small" style="text-align: center; color: var(--text-secondary); opacity: 0.6;">v${APP_VERSION}</p>
            `;
        };

        const isCurrentRoute = (f) => f.from === state.from && f.to === state.to;

        const favChipsHtml = () => {
            const saved = state.favorites.some(isCurrentRoute);
            return state.favorites.map((f, i) =>
                `<button class="chip ${isCurrentRoute(f) ? 'active' : ''}" onclick="actions.applyFav(${i})">${esc(f.name)}</button>`).join('')
                + (saved || state.from === state.to ? '' : `<button class="chip add" onclick="actions.addFav()">＋ この区間を登録</button>`);
        };

        const renderSettings = (root) => {
            const theme = store.get('theme', 'auto');
            const favs = state.favorites;
            root.innerHTML = `
                <h2>設定</h2>
                <div class="glass-card">
                    <div class="settings-item">
                        <div class="settings-label">画面の明るさ</div>
                        <div class="seg">
                            <button class="${theme === 'auto' ? 'active' : ''}" onclick="actions.setTheme('auto')">自動</button>
                            <button class="${theme === 'light' ? 'active' : ''}" onclick="actions.setTheme('light')">ライト</button>
                            <button class="${theme === 'dark' ? 'active' : ''}" onclick="actions.setTheme('dark')">ダーク</button>
                        </div>
                        <div class="small muted">「自動」はスマホの設定（ライト／ダーク）に合わせます。屋外ではライトが見やすくなります。</div>
                    </div>
                </div>
                <div class="glass-card">
                    <div class="settings-label" style="margin-bottom: 6px;">よく使う区間</div>
                    ${favs.length ? `<div>${favs.map((f, i) => `
                        <div class="fav-row">
                            <div><div>${esc(f.name)}</div><div class="sub">${esc(STOPS[f.from])} → ${esc(STOPS[f.to])}</div></div>
                            <button class="mini-btn" onclick="actions.renameFav(${i})">名前変更</button>
                            <button class="mini-btn danger" onclick="actions.deleteFav(${i})">削除</button>
                        </div>`).join('')}</div>`
                    : `<p class="small muted">まだ登録がありません。「バスを調べる」画面の「＋ この区間を登録」から追加できます。</p>`}
                </div>
                <p class="small" style="text-align: center; color: var(--text-secondary); opacity: 0.6;">TimelyBus v${APP_VERSION}</p>
            `;
        };

        const renderCountdown = (root) => {
            const options = (selected) => STOPS.map((s, i) => `<option value="${i}" ${i === selected ? 'selected' : ''}>${esc(s)}</option>`).join('');
            const mode = state.dayOverride || 'auto';
            const searching = state.mode === 'depart' || state.mode === 'arrive';
            if (searching && !state.searchTime[state.mode]) state.searchTime[state.mode] = nowPlus(state.mode === 'arrive' ? 60 : 0);
            const baseDate = new Date();
            if (searching) baseDate.setDate(baseDate.getDate() + state.searchDay);
            const dayName = searching && state.searchDay === 1 ? '明日' : '今日';
            root.innerHTML = `
                <h2>バスを調べる</h2>
                <div class="seg">
                    <button class="${state.mode === 'now' ? 'active' : ''}" onclick="actions.setMode('now')">今すぐ</button>
                    <button class="${state.mode === 'depart' ? 'active' : ''}" onclick="actions.setMode('depart')">出発時刻で</button>
                    <button class="${state.mode === 'arrive' ? 'active' : ''}" onclick="actions.setMode('arrive')">到着時刻で</button>
                    <button class="${state.mode === 'table' ? 'active' : ''}" onclick="actions.setMode('table')">時刻表</button>
                </div>
                <div class="glass-card" style="padding: 18px;">
                    <div class="fav-chips" id="fav-chips">${favChipsHtml()}</div>
                    <div class="stop-picker">
                        <div>
                            <label for="from-stop">乗車</label>
                            <select id="from-stop" class="input-field" onchange="actions.setFrom(this.value)">${options(state.from)}</select>
                        </div>
                        <button class="swap-btn" onclick="actions.swap()" aria-label="乗車と降車を入れ替え">⇅</button>
                        <div>
                            <label for="to-stop">降車</label>
                            <select id="to-stop" class="input-field" onchange="actions.setTo(this.value)">${options(state.to)}</select>
                        </div>
                    </div>
                    ${searching ? `
                    <div class="search-row">
                        <div>
                            <label>日付</label>
                            <div class="seg">
                                <button class="${state.searchDay === 0 ? 'active' : ''}" onclick="actions.setSearchDay(0)">今日</button>
                                <button class="${state.searchDay === 1 ? 'active' : ''}" onclick="actions.setSearchDay(1)">明日</button>
                            </div>
                        </div>
                        <div>
                            <label for="search-time">${state.mode === 'arrive' ? '着きたい時刻' : '出発したい時刻'}</label>
                            <input id="search-time" type="time" class="input-field" value="${state.searchTime[state.mode]}" oninput="actions.setSearchTime(this.value)" onchange="actions.setSearchTime(this.value)">
                        </div>
                    </div>` : ''}
                    <div style="margin-top: 14px;">
                        <div class="small muted" style="margin-bottom: 4px;">ダイヤ（${dayName}は${DAY_LABEL[autoDayType(baseDate)]}）</div>
                        <div class="seg">
                            <button class="${mode === 'auto' ? 'active' : ''}" onclick="actions.setDay(null)">自動</button>
                            <button class="${mode === 'weekday' ? 'active' : ''}" onclick="actions.setDay('weekday')">平日</button>
                            <button class="${mode === 'weekend' ? 'active' : ''}" onclick="actions.setDay('weekend')">土日祝</button>
                        </div>
                    </div>
                </div>
                <div id="cd-results" style="display: grid; gap: 16px;"></div>
                <p class="small muted">鳴門線の主要停留所のみ対応（${esc(PDF_FILES[0].label)}・${esc(PDF_FILES[1].label)}のPDFより）。道路状況により遅れることがあります。</p>
            `;
            state.lastSignature = '';
            tick();
            state.tickId = setInterval(tick, 1000);
        };

        const renderResults = (container, trips, now) => {
            if (state.from === state.to) {
                container.innerHTML = `<div class="glass-card muted" style="text-align:center">乗車と降車に別の停留所を選んでください。</div>`;
                return;
            }
            if (!trips.length) {
                container.innerHTML = `<div class="glass-card muted" style="text-align:center">この区間を直通する便が見つかりません。<br>別の停留所を選ぶか、時刻表PDFをご確認ください。</div>`;
                return;
            }
            const [next, ...rest] = trips;
            let lastOffset = next.offset;
            container.innerHTML = `
                <div class="glass-card next-card">
                    <div class="status-badge"><span class="dot animate-pulse"></span><span>${dayPrefix(next.offset)}${DAY_LABEL[next.dayType]}ダイヤ</span></div>
                    <div class="label">${esc(STOPS[state.from])} 発車まで</div>
                    <div class="time-display" data-dep="${next.depMs}" data-big="1">--:--</div>
                    <div class="trip-route">
                        <span>${dayPrefix(next.offset)}${fmtHM(next.dep)} 発</span><span class="arrow">→</span><span>${fmtHM(next.arr)} 着</span>
                    </div>
                    <div class="trip-meta">所要 ${next.arr - next.dep}分 ・ 行先番号 ${esc(next.no)} ・ ${esc(MARKS[next.mark] || '')}</div>
                    <button class="btn" style="margin-top: 20px;" onclick="actions.ride('${next.id}')">このバスに乗る</button>
                </div>
                ${rest.length ? `
                <div>
                    <h3 class="small muted" style="margin: 0 2px 8px;">その後の便</h3>
                    <div class="trip-list">
                        ${rest.map(t => {
                            const sep = t.offset !== lastOffset ? `<div class="day-sep">${t.offset === 1 ? '明日' : '明後日以降'}（${DAY_LABEL[t.dayType]}ダイヤ）</div>` : '';
                            lastOffset = t.offset;
                            return `${sep}
                            <div class="trip-item">
                                <div class="t">${fmtHM(t.dep)} 発 <span class="arr">→ ${fmtHM(t.arr)} 着</span></div>
                                <div class="remain" data-dep="${t.depMs}">--</div>
                                <div class="sub">所要${t.arr - t.dep}分 ・ ${esc(MARKS[t.mark] || '')}</div>
                                <button class="ride" onclick="actions.ride('${t.id}')">乗る</button>
                            </div>`;
                        }).join('')}
                    </div>
                </div>` : ''}
            `;
        };

        const renderSearchResults = (container, result) => {
            if (state.from === state.to) {
                container.innerHTML = `<div class="glass-card muted" style="text-align:center">乗車と降車に別の停留所を選んでください。</div>`;
                return;
            }
            if (!result || !result.best) {
                container.innerHTML = `<div class="glass-card muted" style="text-align:center">この区間を直通する便が見つかりません。<br>別の停留所を選ぶか、時刻表PDFをご確認ください。</div>`;
                return;
            }
            const b = result.best;
            const time = state.searchTime[state.mode];
            const day = state.searchDay === 1 ? '明日 ' : '';
            const question = state.mode === 'arrive'
                ? `${day}${esc(STOPS[state.to])}に ${esc(time)} までに着くには`
                : `${day}${esc(STOPS[state.from])}を ${esc(time)} 以降に出る最初の便`;
            const now = Date.now();
            const departed = (t) => t.depMs + DEPARTED_GRACE_MS <= now;
            container.innerHTML = `
                <div class="glass-card next-card result-head">
                    <div class="status-badge"><span class="dot"></span><span>${day}${DAY_LABEL[result.dayType]}ダイヤ</span></div>
                    <div class="q">${question}</div>
                    <div class="trip-route" style="font-size: 1.9rem;">
                        <span>${fmtHM(b.dep)} 発</span><span class="arrow">→</span><span>${fmtHM(b.arr)} 着</span>
                    </div>
                    <div class="trip-meta">${esc(STOPS[state.from])} → ${esc(STOPS[state.to])} ・ 所要 ${b.arr - b.dep}分 ・ 行先番号 ${esc(b.no)}</div>
                    <div class="trip-meta">${esc(MARKS[b.mark] || '')}</div>
                    ${!departed(b) ? `<div class="trip-meta" style="color: var(--accent-primary); font-weight: 700; font-size: 0.95rem;">発車まで <span data-dep="${b.depMs}" data-plain="1"></span></div>` : ''}
                    ${result.note ? `<div class="trip-meta" style="color: var(--warn-color); margin-top: 8px;">${result.note}</div>` : ''}
                    ${b.arrMs > now ? `<button class="btn" style="margin-top: 18px;" onclick="actions.ride('${b.id}')">この便でカウントダウン</button>` : ''}
                </div>
                <div>
                    <h3 class="small muted" style="margin: 0 2px 8px;">前後の便</h3>
                    <div class="trip-list">
                        ${result.trips.map(t => `
                            <div class="trip-item ${t === b ? 'best' : ''} ${departed(t) ? 'past' : ''}">
                                <div class="t">${fmtHM(t.dep)} 発 <span class="arr">→ ${fmtHM(t.arr)} 着</span>${t === b ? '<span class="tag">おすすめ</span>' : ''}</div>
                                <div class="remain" data-dep="${t.depMs}">--</div>
                                <div class="sub">${state.mode === 'arrive' && t.arr > toMin(time) ? '<span style="color: var(--warn-color); font-weight: 700;">間に合わない</span> ・ ' : ''}所要${t.arr - t.dep}分 ・ ${esc(MARKS[t.mark] || '')}</div>
                                ${t.arrMs > now ? `<button class="ride" onclick="actions.ride('${t.id}')">乗る</button>` : '<span></span>'}
                            </div>`).join('')}
                    </div>
                </div>
            `;
        };

        // 乗車停留所の時刻表（降車停留所まで行く便だけ）を、時ごとの行で表示する
        const renderTimetable = (container, now) => {
            if (state.from === state.to) {
                container.innerHTML = `<div class="glass-card muted" style="text-align:center">乗車と降車に別の停留所を選んでください。</div>`;
                return;
            }
            const dayType = state.dayOverride || autoDayType(now);
            const isToday = dayType === autoDayType(now);
            const dir = state.from < state.to ? 'down' : 'up';
            const trips = TIMETABLE[dayType][dir]
                .filter(t => t.times[state.from] != null && t.times[state.to] != null)
                .map(t => ({ ...t, dep: t.times[state.from], arr: t.times[state.to] }))
                .sort((a, b) => a.dep - b.dep);
            if (!trips.length) {
                container.innerHTML = `<div class="glass-card muted" style="text-align:center">この区間を直通する便が見つかりません。</div>`;
                return;
            }
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const next = isToday ? trips.find(t => t.dep >= nowMin) : null;
            const hours = [];
            for (const t of trips) {
                const h = Math.floor(t.dep / 60);
                if (!hours.length || hours[hours.length - 1].h !== h) hours.push({ h, trips: [] });
                hours[hours.length - 1].trips.push(t);
            }
            const usedMarks = [...new Set(trips.map(t => t.mark))].sort();
            container.innerHTML = `
                <div class="glass-card" style="padding: 14px 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 4px 10px;">
                        <div style="font-weight: 700;">${esc(STOPS[state.from])} 発</div>
                        <div class="small muted">${esc(STOPS[state.to])} 行き ・ ${DAY_LABEL[dayType]}ダイヤ</div>
                    </div>
                    <div class="tt">
                        ${hours.map(({ h, trips: hs }) => `
                            <div class="tt-row ${next && Math.floor(next.dep / 60) === h ? 'current' : ''}">
                                <div class="tt-h">${h}</div>
                                <div class="tt-mins">
                                    ${hs.map(t => `
                                        <div class="tt-m ${t === next ? 'next' : ''} ${isToday && t.dep < nowMin ? 'past' : ''}">
                                            <b>${String(t.dep % 60).padStart(2, '0')}</b><span class="tt-mark">${t.mark}</span>
                                            <small>→${fmtHM(t.arr)}</small>
                                        </div>`).join('')}
                                </div>
                            </div>`).join('')}
                    </div>
                    <div class="small muted" style="margin: 12px 4px 0; line-height: 1.7;">
                        「→」は${esc(STOPS[state.to])}の到着時刻。${next ? '青枠は次の便。' : ''}${isToday ? '薄い字は今日もう出発した便。' : ''}<br>
                        ${usedMarks.map(m => `${m ? m : '無印'}：${esc(MARKS[m])}`).join('<br>')}
                    </div>
                </div>
            `;
        };

        const renderRiding = (container, now) => {
            const r = state.riding;
            container.innerHTML = `
                <div class="glass-card next-card">
                    <div class="status-badge" id="ride-badge"><span class="dot animate-pulse"></span><span id="ride-status">乗車中</span></div>
                    <div class="label">${esc(STOPS[r.to])} 到着まで</div>
                    <div class="time-display" id="ride-countdown">--:--</div>
                    <div class="trip-route">
                        <span>${fmtHM(r.dep)} 発</span><span class="arrow">→</span><span>${fmtHM(r.arr)} 着予定</span>
                    </div>
                    <div class="trip-meta">${esc(STOPS[r.from])} → ${esc(STOPS[r.to])} ・ 行先番号 ${esc(r.no)}</div>
                    <div class="progress"><div id="ride-progress" style="width: 0%"></div></div>
                    <button class="btn" style="margin-top: 20px;" onclick="actions.endRide()">乗車を終了</button>
                </div>
            `;
        };

        const updateRiding = (now) => {
            const r = state.riding;
            const el = document.getElementById('ride-countdown');
            if (!el) return;
            const status = document.getElementById('ride-status');
            const badge = document.getElementById('ride-badge');
            const t = now.getTime();
            const diffArr = r.arrMs - t;
            if (t < r.depMs) {
                status.textContent = `発車まで ${formatCountdown(r.depMs - t)}`;
            } else if (diffArr > 0) {
                status.textContent = '乗車中';
            } else {
                status.textContent = '到着予定時刻を過ぎました';
                badge.style.background = 'var(--success-glow)';
                badge.style.color = 'var(--success-color)';
            }
            el.textContent = formatCountdown(diffArr);
            el.classList.toggle('long', diffArr >= 3600000);
            el.classList.toggle('arrived', diffArr <= 0);
            const pct = clamp((t - r.depMs) / Math.max(1, r.arrMs - r.depMs), 0, 1) * 100;
            document.getElementById('ride-progress').style.width = pct + '%';
        };

        // 1秒ごとの更新。便の並びが変わったときだけ再描画し、普段は数字だけ書き換える
        let lastTrips = [];
        const tick = () => {
            const container = document.getElementById('cd-results');
            if (!container) return;
            const now = new Date();

            if (state.riding) {
                if (state.lastSignature !== 'riding') {
                    renderRiding(container, now);
                    state.lastSignature = 'riding';
                }
                updateRiding(now);
                return;
            }

            if (state.mode === 'table') {
                // 次の便のハイライトが動いたときだけ描き直す
                const next = getUpcoming(state.from, state.to, now, 1)[0];
                const signature = `table-${state.from}-${state.to}-${state.dayOverride}-${now.toDateString()}-${next ? next.id : ''}`;
                if (signature !== state.lastSignature) {
                    const first = !state.lastSignature.startsWith('table-');
                    renderTimetable(container, now);
                    state.lastSignature = signature;
                    if (first) {
                        const row = container.querySelector('.tt-row.current');
                        if (row) row.scrollIntoView({ block: 'center' });
                    }
                }
                return;
            }

            if (state.mode === 'now') {
                const trips = getUpcoming(state.from, state.to, now, 6);
                lastTrips = trips;
                const signature = `now-${state.from}-${state.to}-${state.dayOverride}-` + trips.map(t => t.id).join(',');
                if (signature !== state.lastSignature) {
                    renderResults(container, trips, now);
                    state.lastSignature = signature;
                }
            } else {
                // 検索結果は条件が変わったとき（と、便が発車したとき）だけ描き直す
                const time = state.searchTime[state.mode];
                const departedCount = lastTrips.filter(t => t.depMs + DEPARTED_GRACE_MS <= now.getTime()).length;
                const signature = `${state.mode}-${state.from}-${state.to}-${state.dayOverride}-${state.searchDay}-${time}-${now.toDateString()}-${departedCount}`;
                if (signature !== state.lastSignature && time) {
                    const result = searchTrips(state.from, state.to, state.searchDay, state.mode, toMin(time));
                    lastTrips = result ? result.trips : [];
                    renderSearchResults(container, result);
                    state.lastSignature = `${state.mode}-${state.from}-${state.to}-${state.dayOverride}-${state.searchDay}-${time}-${now.toDateString()}-${lastTrips.filter(t => t.depMs + DEPARTED_GRACE_MS <= now.getTime()).length}`;
                }
            }
            container.querySelectorAll('[data-dep]').forEach(el => {
                const diff = Number(el.dataset.dep) - now.getTime();
                if (el.dataset.plain) {
                    el.textContent = diff > 0 ? formatCountdown(diff) : '発車時刻';
                } else if (el.dataset.big) {
                    el.textContent = diff > 0 ? formatCountdown(diff) : '発車時刻';
                    el.classList.toggle('long', diff >= 3600000 || diff <= 0);
                    el.classList.toggle('soon', diff > 0 && diff <= 5 * 60000);
                    el.classList.toggle('now', diff <= 60000);
                } else {
                    el.textContent = formatRemainShort(diff);
                }
            });
        };

        const stopTick = () => {
            if (state.tickId) clearInterval(state.tickId);
            state.tickId = null;
        };

        const renderPdfList = (root) => {
            const last = store.get('lastPdf', '');
            root.innerHTML = `
                <h2>時刻表PDF</h2>
                <p class="muted small">「表示」でアプリ内ビューアが開きます。拡大した倍率と位置は時刻表ごとに記憶され、次回はそのまま表示されます。</p>
                <button class="btn" style="padding: 12px;" onclick="state.mode = 'table'; store.set('mode', 'table'); router.navigate('countdown')">鳴門線は停留所ごとの見やすい時刻表もあります →</button>
                <div style="display: grid; gap: 12px;">
                    ${PDF_FILES.map(pdf => `
                        <div class="glass-card pdf-card" ${pdf.name === last ? 'style="border-color: var(--accent-primary)"' : ''}>
                            <div style="font-weight: 600; font-size: 1.1rem">${esc(pdf.label)}${pdf.name === last ? ' <span class="small" style="color: var(--accent-primary)">前回表示</span>' : ''}</div>
                            <div class="pdf-actions">
                                <button class="btn btn-primary" onclick="router.navigate('view', '${pdf.name}')">表示</button>
                                <a href="./pdf/${pdf.name}" download class="btn">保存</a>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        };

        // --- PDF VIEWER ---
        // PDF.js でページを高解像度の画像にし、拡大・スクロールを自前で扱う。
        // 倍率とスクロール位置はファイルごとに localStorage へ保存する。
        const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
        const RENDER_LONG_SIDE = 2600;   // 画像化するときの長辺ピクセル数（3倍程度まで拡大しても読める）
        const MIN_ZOOM = 1, MAX_ZOOM = 6;
        const pageCache = {};             // name -> [{url, w, h}]

        let pdfjsPromise = null;
        const loadPdfJs = () => {
            if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
            if (pdfjsPromise) return pdfjsPromise;
            pdfjsPromise = new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = PDFJS_BASE + 'pdf.min.js';
                s.onload = () => {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
                    resolve(window.pdfjsLib);
                };
                s.onerror = () => { pdfjsPromise = null; reject(new Error('PDF.js の読み込みに失敗しました')); };
                document.head.appendChild(s);
            });
            return pdfjsPromise;
        };

        // ページ周囲の白い余白を切り落とす（その分、表が大きく表示される）
        const trimWhitespace = (canvas) => {
            const SAMPLE = 4, PAD = 24;
            const sw = Math.ceil(canvas.width / SAMPLE), sh = Math.ceil(canvas.height / SAMPLE);
            const small = document.createElement('canvas');
            small.width = sw; small.height = sh;
            const sctx = small.getContext('2d');
            sctx.drawImage(canvas, 0, 0, sw, sh);
            const data = sctx.getImageData(0, 0, sw, sh).data;
            let x0 = sw, y0 = sh, x1 = -1, y1 = -1;
            for (let y = 0; y < sh; y++) {
                for (let x = 0; x < sw; x++) {
                    const i = (y * sw + x) * 4;
                    if (data[i] < 235 || data[i + 1] < 235 || data[i + 2] < 235) {
                        if (x < x0) x0 = x; if (x > x1) x1 = x;
                        if (y < y0) y0 = y; if (y > y1) y1 = y;
                    }
                }
            }
            small.width = small.height = 0;
            if (x1 < 0) return canvas;
            const left = Math.max(0, x0 * SAMPLE - PAD), top = Math.max(0, y0 * SAMPLE - PAD);
            const right = Math.min(canvas.width, (x1 + 1) * SAMPLE + PAD), bottom = Math.min(canvas.height, (y1 + 1) * SAMPLE + PAD);
            const out = document.createElement('canvas');
            out.width = right - left; out.height = bottom - top;
            out.getContext('2d').drawImage(canvas, left, top, out.width, out.height, 0, 0, out.width, out.height);
            return out;
        };

        const renderPdfPages = async (name, onProgress) => {
            if (pageCache[name]) return pageCache[name];
            const pdfjs = await loadPdfJs();
            // 分割読み込みはオフライン保存（Service Worker）と相性が悪いので、ファイルを丸ごと読む
            const doc = await pdfjs.getDocument({ url: './pdf/' + name, disableRange: true, disableStream: true }).promise;
            const pages = [];
            for (let i = 1; i <= doc.numPages; i++) {
                onProgress(i, doc.numPages);
                const page = await doc.getPage(i);
                const base = page.getViewport({ scale: 1 });
                const viewport = page.getViewport({ scale: RENDER_LONG_SIDE / Math.max(base.width, base.height) });
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(viewport.width);
                canvas.height = Math.round(viewport.height);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                await page.render({ canvasContext: ctx, viewport }).promise;
                const out = trimWhitespace(canvas);
                const blob = await new Promise(res => out.toBlob(res, 'image/png'));
                pages.push({ url: URL.createObjectURL(blob), w: out.width, h: out.height });
                canvas.width = canvas.height = 0; // メモリ解放（iOS対策）
                out.width = out.height = 0;
                page.cleanup();
            }
            doc.destroy();
            return (pageCache[name] = pages);
        };

        const viewer = {
            v: null,

            open(root, name) {
                const pdf = PDF_FILES.find(p => p.name === name);
                if (!pdf) { router.navigate('pdf', null, true); return; }
                store.set('lastPdf', name);

                root.innerHTML = `
                    <div class="viewer">
                        <div class="viewer-bar">
                            <button class="icon-btn" onclick="router.back('pdf')" aria-label="戻る">‹</button>
                            <div class="viewer-title">${esc(pdf.label)}</div>
                            <button class="icon-btn" onclick="viewer.step(-1)" aria-label="縮小">−</button>
                            <button class="icon-btn zoom-label" id="zoom-label" onclick="viewer.fit()" aria-label="幅に合わせる">100%</button>
                            <button class="icon-btn" onclick="viewer.step(1)" aria-label="拡大">＋</button>
                        </div>
                        <div class="viewer-scroll" id="viewer-scroll">
                            <div class="viewer-pages" id="viewer-pages"><div class="viewer-msg" id="viewer-msg">読み込み中…</div></div>
                        </div>
                        <div class="viewer-hint" id="viewer-hint" style="opacity:0"></div>
                    </div>
                `;
                document.body.style.overflow = 'hidden';

                const scroll = document.getElementById('viewer-scroll');
                const inner = document.getElementById('viewer-pages');
                const v = this.v = { name, scroll, inner, zoom: 1, ready: false, pinch: null, lastTap: null, saveTimer: null };
                this.bindGestures(v);

                renderPdfPages(name, (i, n) => {
                    const msg = document.getElementById('viewer-msg');
                    if (msg) msg.textContent = `読み込み中… ${i} / ${n} ページ`;
                }).then(pages => {
                    if (this.v !== v) return;
                    inner.innerHTML = pages.map(p => `<img src="${p.url}" width="${p.w}" height="${p.h}" alt="" draggable="false">`).join('');
                    v.pages = pages;
                    v.ready = true;
                    this.restore(v);
                }).catch(err => {
                    if (this.v !== v) return;
                    console.error(err);
                    inner.innerHTML = `
                        <div class="viewer-msg">
                            時刻表を表示できませんでした（オフラインの可能性があります）。<br><br>
                            <a class="btn btn-primary" href="./pdf/${name}" target="_blank" style="max-width: 280px; margin: 0 auto;">ブラウザでPDFを開く</a>
                        </div>`;
                });
            },

            close() {
                if (!this.v) return;
                this.save(this.v);
                clearTimeout(this.v.saveTimer);
                this.v = null;
                document.body.style.overflow = '';
            },

            // 初回の倍率: スマホで文字が読めるくらいの幅にする（横長ページ≒画面の高さに合わせる）
            defaultZoom(v) {
                const p = v.pages[0];
                const targetWidth = p.w > p.h ? Math.max(1000, v.scroll.clientHeight * p.w / p.h) : 1100;
                return clamp(targetWidth / v.scroll.clientWidth, MIN_ZOOM, 3);
            },

            restore(v) {
                const saved = store.get('view.' + v.name, null);
                this.setZoom(v, saved ? saved.zoom : this.defaultZoom(v), 0, 0, true);
                requestAnimationFrame(() => {
                    const s = v.scroll;
                    if (saved) {
                        s.scrollLeft = saved.x * s.scrollWidth;
                        s.scrollTop = saved.y * s.scrollHeight;
                        this.hint(`前回の倍率（${Math.round(v.zoom * 100)}%）で表示しています`);
                    } else {
                        this.hint('2本指で拡大・縮小／ダブルタップで切替（倍率は記憶されます）');
                    }
                });
            },

            save(v) {
                if (!v || !v.ready) return;
                const s = v.scroll;
                store.set('view.' + v.name, {
                    zoom: Math.round(v.zoom * 100) / 100,
                    x: s.scrollWidth ? s.scrollLeft / s.scrollWidth : 0,
                    y: s.scrollHeight ? s.scrollTop / s.scrollHeight : 0
                });
            },

            scheduleSave(v) {
                clearTimeout(v.saveTimer);
                v.saveTimer = setTimeout(() => this.save(v), 300);
            },

            // ax, ay: 拡大の基準点（スクロール領域内の座標）
            setZoom(v, zoom, ax, ay, silent) {
                zoom = clamp(zoom, MIN_ZOOM, MAX_ZOOM);
                const s = v.scroll;
                const ratio = zoom / v.zoom;
                const cx = s.scrollLeft + ax, cy = s.scrollTop + ay;
                v.zoom = zoom;
                v.inner.style.width = (s.clientWidth * zoom) + 'px';
                s.scrollLeft = cx * ratio - ax;
                s.scrollTop = cy * ratio - ay;
                const label = document.getElementById('zoom-label');
                if (label) label.textContent = Math.round(zoom * 100) + '%';
                if (!silent) this.scheduleSave(v);
            },

            step(dir) {
                const v = this.v;
                if (!v || !v.ready) return;
                const s = v.scroll;
                this.setZoom(v, v.zoom * (dir > 0 ? 1.25 : 0.8), s.clientWidth / 2, s.clientHeight / 2);
            },

            fit() {
                const v = this.v;
                if (!v || !v.ready) return;
                this.setZoom(v, 1, 0, 0);
            },

            hint(text) {
                const el = document.getElementById('viewer-hint');
                if (!el) return;
                el.textContent = text;
                el.style.opacity = '1';
                clearTimeout(this.hintTimer);
                this.hintTimer = setTimeout(() => { el.style.opacity = '0'; }, 2500);
            },

            bindGestures(v) {
                const s = v.scroll;
                const point = (t) => { const r = s.getBoundingClientRect(); return { x: t.clientX - r.left, y: t.clientY - r.top }; };
                const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

                s.addEventListener('touchstart', (e) => {
                    if (!v.ready) return;
                    if (e.touches.length === 2) {
                        v.pinch = { d: dist(e.touches[0], e.touches[1]), zoom: v.zoom };
                        v.lastTap = null;
                    }
                }, { passive: true });

                s.addEventListener('touchmove', (e) => {
                    if (!v.pinch || e.touches.length !== 2) return;
                    e.preventDefault();
                    const [a, b] = e.touches;
                    const mid = point({ clientX: (a.clientX + b.clientX) / 2, clientY: (a.clientY + b.clientY) / 2 });
                    this.setZoom(v, v.pinch.zoom * dist(a, b) / v.pinch.d, mid.x, mid.y);
                }, { passive: false });

                s.addEventListener('touchend', (e) => {
                    if (v.pinch) {
                        if (e.touches.length < 2) v.pinch = null;
                        return;
                    }
                    if (!v.ready || e.touches.length || e.changedTouches.length !== 1) return;
                    // ダブルタップ: 幅合わせ ⇔ 記憶した倍率（なければ初期倍率）
                    const t = e.changedTouches[0];
                    const now = Date.now();
                    const last = v.lastTap;
                    if (last && now - last.time < 300 && Math.hypot(t.clientX - last.x, t.clientY - last.y) < 30) {
                        e.preventDefault();
                        const p = point(t);
                        const target = v.zoom > 1.05 ? 1 : Math.max(1.5, v.preferred || this.defaultZoom(v));
                        if (v.zoom > 1.05) v.preferred = v.zoom;
                        this.setZoom(v, target, p.x, p.y);
                        v.lastTap = null;
                    } else {
                        v.lastTap = { time: now, x: t.clientX, y: t.clientY };
                    }
                });

                // パソコン: ダブルクリック / Ctrl+ホイール
                s.addEventListener('dblclick', (e) => {
                    if (!v.ready) return;
                    const p = point(e);
                    this.setZoom(v, v.zoom > 1.05 ? 1 : this.defaultZoom(v), p.x, p.y);
                });
                s.addEventListener('wheel', (e) => {
                    if (!v.ready || !e.ctrlKey) return;
                    e.preventDefault();
                    const p = point(e);
                    this.setZoom(v, v.zoom * Math.exp(-e.deltaY / 300), p.x, p.y);
                }, { passive: false });

                s.addEventListener('scroll', () => { if (v.ready) this.scheduleSave(v); }, { passive: true });
            }
        };

        // iOS Safari のページ全体のピンチズームをビューア表示中は止める（ビューア側で拡大する）
        document.addEventListener('gesturestart', (e) => { if (viewer.v) e.preventDefault(); });

        // 画面回転・リサイズ時は倍率を保ったまま幅を合わせ直す
        window.addEventListener('resize', () => {
            const v = viewer.v;
            if (!v || !v.ready) return;
            const s = v.scroll;
            const x = s.scrollLeft / s.scrollWidth, y = s.scrollTop / s.scrollHeight;
            v.inner.style.width = (s.clientWidth * v.zoom) + 'px';
            s.scrollLeft = x * s.scrollWidth;
            s.scrollTop = y * s.scrollHeight;
        });

        // --- ROUTER（URLの # を使うので、スマホの「戻る」ボタンで前の画面に戻れる） ---
        let inAppNavigations = 0;
        const router = {
            current: () => {
                const [name, arg] = location.hash.replace(/^#/, '').split('/');
                if (['countdown', 'pdf', 'view', 'settings'].includes(name)) return { name, arg: arg ? decodeURIComponent(arg) : null };
                return { name: 'home', arg: null };
            },
            navigate: (page, arg, replace) => {
                const hash = page === 'home' ? '' : '#' + page + (arg ? '/' + encodeURIComponent(arg) : '');
                const url = location.pathname + location.search + hash;
                if (replace) history.replaceState(null, '', url);
                else { history.pushState(null, '', url); inAppNavigations++; }
                onRouteChange();
            },
            back: (fallback) => {
                if (inAppNavigations > 0) history.back();
                else router.navigate(fallback, null, true);
            }
        };

        const onRouteChange = () => {
            if (router.current().name !== 'view') viewer.close();
            render();
        };

        window.addEventListener('popstate', () => {
            inAppNavigations = Math.max(0, inAppNavigations - 1);
            onRouteChange();
        });

        // 画面を閉じる・アプリを切り替えるときにビューアの状態を保存
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) viewer.save(viewer.v);
            else tick();
        });

        // --- ACTIONS ---
        const actions = {
            setFrom: (v) => { state.from = Number(v); actions.saveRoute(); },
            setTo: (v) => { state.to = Number(v); actions.saveRoute(); },
            swap: () => {
                [state.from, state.to] = [state.to, state.from];
                document.getElementById('from-stop').value = state.from;
                document.getElementById('to-stop').value = state.to;
                actions.saveRoute();
            },
            saveRoute: () => {
                store.set('route', { from: state.from, to: state.to });
                actions.refreshFavChips();
                if (state.riding) actions.endRide();
                else tick();
            },
            refreshFavChips: () => {
                const el = document.getElementById('fav-chips');
                if (el) el.innerHTML = favChipsHtml();
            },
            applyFav: (i) => {
                const f = state.favorites[i];
                if (!f) return;
                state.from = f.from;
                state.to = f.to;
                document.getElementById('from-stop').value = state.from;
                document.getElementById('to-stop').value = state.to;
                actions.saveRoute();
            },
            saveFavorites: () => store.set('favorites', state.favorites),
            addFav: () => {
                const fallback = `${STOPS[state.from]}→${STOPS[state.to]}`;
                const name = window.prompt('この区間の名前（例：通勤 行き）', fallback);
                if (name === null) return;
                state.favorites.push({ name: name.trim().slice(0, 20) || fallback, from: state.from, to: state.to });
                actions.saveFavorites();
                actions.refreshFavChips();
            },
            renameFav: (i) => {
                const f = state.favorites[i];
                if (!f) return;
                const name = window.prompt('新しい名前', f.name);
                if (name === null || !name.trim()) return;
                f.name = name.trim().slice(0, 20);
                actions.saveFavorites();
                render();
            },
            deleteFav: (i) => {
                const f = state.favorites[i];
                if (!f || !window.confirm(`「${f.name}」を削除しますか？`)) return;
                state.favorites.splice(i, 1);
                actions.saveFavorites();
                render();
            },
            setTheme: (t) => {
                store.set('theme', t);
                applyTheme(t);
                render();
            },
            setDay: (d) => { state.dayOverride = d; render(); },
            setMode: (m) => {
                state.mode = m;
                store.set('mode', m);
                if (state.riding) { state.riding = null; store.remove('riding'); }
                render();
            },
            setSearchDay: (d) => { state.searchDay = d; render(); },
            setSearchTime: (v) => {
                if (!/^\d{1,2}:\d{2}/.test(v)) return;
                state.searchTime[state.mode] = v.slice(0, 5);
                tick();
            },
            ride: (id) => {
                const t = lastTrips.find(x => x.id === id);
                if (!t) return;
                state.riding = { from: state.from, to: state.to, no: t.no, dep: t.dep, arr: t.arr, depMs: t.depMs, arrMs: t.arrMs };
                store.set('riding', state.riding);
                tick();
            },
            endRide: () => {
                state.riding = null;
                store.remove('riding');
                state.lastSignature = '';
                tick();
            }
        };

        // Initialize
        render();

        // オフライン対応（PDFとビューアを端末に保存する）。file:// で開いたときは使えないので登録しない
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            navigator.serviceWorker.register('./sw.js?v=' + APP_VERSION).catch(err => console.warn('Service Worker 登録失敗', err));
        }
    </script>
</body>
</html>
